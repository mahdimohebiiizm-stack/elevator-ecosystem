services:
  postgres:
    image: postgres:16-alpine
    container_name: shopbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: shopbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopbot_net

  redis:
    image: redis:7-alpine
    container_name: shopbot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - shopbot_net

  minio:
    image: minio/minio:latest
    container_name: shopbot_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - shopbot_net

  minio_setup:
    image: minio/mc:latest
    container_name: shopbot_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/shopbot-media;
      /usr/bin/mc anonymous set download myminio/shopbot-media;
      exit 0;
      "
    networks:
      - shopbot_net

  api_backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: shopbot_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "ShopBot Backend"
      API_V1_STR: "/api/v1"
      ENVIRONMENT: "development"
      DEBUG: "True"
      SECRET_KEY: "temporary-dev-secret-key-change-in-production-replace-with-secure-value"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "11520"
      DATABASE_URL: "postgresql+asyncpg://postgres:123456@postgres:5432/shopbot_db"
      REDIS_URL: "redis://redis:6379/0"
      ZARINPAL_MERCHANT_ID: "00000000-0000-0000-0000-000000000000"
      ZARINPAL_SANDBOX: "True"
      PAYMENT_CALLBACK_URL: "http://localhost:8000/api/v1/payment/verify"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET_NAME: "shopbot-media"
      S3_REGION: "us-east-1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shopbot_net

  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.ai_worker
    container_name: shopbot_ai_worker
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      ENVIRONMENT: "development"
      PORT: "50051"
    networks:
      - shopbot_net

  outbox_worker:
    build:
      context: .
      dockerfile: Dockerfile.outbox_worker
    container_name: shopbot_outbox_worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql+asyncpg://postgres:123456@postgres:5432/shopbot_db"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "temporary-dev-secret-key-change-in-production-replace-with-secure-value"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopbot_net

networks:
  shopbot_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
