name: elevator_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_image_compress: 2.5.1
  path_provider: ^2.1.2
  dio: ^5.11.1
  share_plus: ^13.3.1
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.1
  flutter_localizations:
    sdk: flutter
  persian_datetime_picker: ^3.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  pdf: ^3.11.1
  printing: ^5.13.2

  # پکیج‌های فایربیس و نوتیفیکیشن
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^17.2.4

  # معماری مدیریت وضعیت و مقایسه اشیاء
  flutter_bloc: ^8.1.3
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
